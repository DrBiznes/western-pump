modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "westernpump"
version = "0.0.3"
displayName = "Create: Western Pump"
authors = "jamino"
description = '''A Create-themed gas station pump that refuels vehicles with a physical, saggy fuel hose.'''

[[dependencies."westernpump"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.80,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."westernpump"]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies."westernpump"]]
modId = "create"
type = "required"
versionRange = "[6.0.9,6.1.0)"
ordering = "AFTER"
side = "BOTH"

# Sable adds the moving sub-level vehicles this pump is designed to refuel.
# It is optional: Sable Companion (bundled) provides a no-op implementation when
# Sable is absent, in which case the pump still works on ordinary world blocks.
[[dependencies."westernpump"]]
modId = "sable"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# The fuel pump appears in Create: Diesel Generators' creative tab when that mod is installed.
# Optional, with AFTER ordering so its creative tab is registered before we add to it; without it
# the pump falls back to its own tab.
[[dependencies."westernpump"]]
modId = "createdieselgenerators"
type = "optional"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"
