modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
# Rendered by tools/generate_icon.py: the pump raycast in isometric over Create's logo disc.
logoFile = "westernpump_icon.png"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# Sable adds the moving sub-level vehicles this pump is designed to refuel.
# It is optional: Sable Companion (bundled) provides a no-op implementation when
# Sable is absent, in which case the pump still works on ordinary world blocks.
[[dependencies."${mod_id}"]]
modId = "sable"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# The fuel pump appears in Create: Diesel Generators' creative tab when that mod is installed.
# Optional, with AFTER ordering so its creative tab is registered before we add to it; without it
# the pump falls back to its own tab.
[[dependencies."${mod_id}"]]
modId = "createdieselgenerators"
type = "optional"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"
